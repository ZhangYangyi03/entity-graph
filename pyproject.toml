[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entitygraph"
version = "0.1.0"
description = "Company entity graph assembled only from keyless public sources, every edge citing its URL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yangyi Zhang"}]
keywords = ["entity-resolution", "corporate-registry", "gleif", "sec-edgar", "sanctions", "knowledge-graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
entitygraph = "entitygraph.cli:main"

[tool.setuptools.packages.find]
include = ["entitygraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
